<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MediCare Control Center</title>
<script src="assets/js/theme.js"></script><script src="assets/js/responsive.js"></script>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
.cc-tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem 1rem;background:var(--card);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:4;scrollbar-width:thin}
.cc-tabs button{white-space:nowrap;border-radius:999px;padding:.45rem .9rem}
.cc-tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cc-wrap{max-width:1150px;margin:auto;padding:1rem}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.cc-card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:1rem}
.cc-card h3{margin:.1rem 0 .6rem}
.cc-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.cc-stat b{font-size:1.5rem;display:block}.cc-stat span{color:var(--mut);font-size:.9rem}
.cc-form{display:grid;gap:.6rem;max-width:none}.cc-form .two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.cc-chk{flex-direction:row!important;align-items:center;gap:.5rem}
.cc-prev{border-radius:14px;padding:1rem;color:#fff;display:flex;align-items:center;gap:.7rem;font-weight:700;font-size:1.2rem}
.cc-prev img{height:2.2rem;border-radius:8px;background:#fff3}
.pill{display:inline-block;border-radius:99px;padding:.05rem .6rem;font-size:.8rem;border:1px solid var(--br)}
.pill.ok{background:#d9f3e4;color:#0d6b3a}.pill.bad{background:#fde2e0;color:#a4261e}.pill.warn{background:#fff0cf;color:#8a5a00}
.mini{padding:.2rem .6rem;border-radius:8px;min-height:0}
.deny{max-width:560px;margin:3rem auto}
table select,table input{padding:.25rem .4rem}
@media(max-width:640px){.cc-form .two{grid-template-columns:1fr}.cc-wrap{padding:.6rem}}
</style>
</head>

</body>
</html>
