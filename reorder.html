<!doctype html>
<html lang="bn"><head><script src="assets/js/server-sync.js"></script><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="no-referrer">
<script src="assets/js/theme.js"></script><script src="assets/js/responsive.js"></script><script src="assets/js/prefs.js"></script><script src="assets/js/panel.js" defer></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediCare – Reorder List</title>
<style>
:root{--bg:#f4f7fb;--fg:#12263a;--card:#fff;--br:#d6e0ea;--pri:#667eea;--mut:#5b6b7b;--bad:#b3261e;--ok:#146c43}
@media(prefers-color-scheme:dark){:root{--bg:#10171f;--fg:#e6eef6;--card:#17212c;--br:#2b3a4a;--mut:#9fb0c0;--ok:#6fdc9d}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}main{max-width:1000px;margin:auto;padding:1rem 16px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:1rem;margin:.8rem 0}.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
input,select{padding:.5rem;border:1px solid var(--br);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:.5rem .9rem;cursor:pointer;font:inherit;text-decoration:none}
.btn2{border:1px solid var(--br);background:var(--card);color:var(--fg);border-radius:8px;padding:.5rem .9rem;cursor:pointer;font:inherit;text-decoration:none}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{border-bottom:1px solid var(--br);padding:.5rem;text-align:left}.muted{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}.k div{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:.7rem}.k b{display:block;font-size:1.25rem}
.tag{display:inline-block;border:1px solid var(--br);border-radius:999px;padding:.05rem .5rem;font-size:.8rem}.tag.bad{border-color:var(--bad)}table.q input[type=number]{width:5rem}.po{page-break-inside:avoid}.row.sp{justify-content:space-between}@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style><script src="assets/js/dialogs.js"></script></head>
<body><main>
<h1>🛒 স্মার্ট রিঅর্ডার</h1>
<p class="muted noprint">স্টক কম ওষুধ — গত দিনের বিক্রির গতি দেখে কতটা কিনবেন তা সাজেস্ট করে। সাপ্লায়ার অনুযায়ী অর্ডার তৈরি, WhatsApp/প্রিন্ট/CSV।</p>
<div id="deny" class="card" hidden>শুধু <b>Admin</b> ও <b>Pharmacist</b>। <a href="login.html">Login</a></div>
<div id="box" hidden>
 <div class="card row noprint">
  <label>কত দিনের স্টক চান <input type="number" id="cover" value="14" min="1" max="120" style="width:80px"></label>
  <label>বিক্রির হিসাব (দিন) <input type="number" id="look" value="30" min="7" max="180" style="width:80px"></label>
  <label>সাপ্লায়ার <select id="sup"><option value="">সব</option></select></label>
  <label><input type="checkbox" id="urgent"> শুধু জরুরি (স্টক ০ বা ৭ দিনের কম)</label>
  <input id="q" type="search" placeholder="ওষুধ খুঁজুন…" style="flex:1;min-width:140px">
 </div>
 <div class="k" id="k"></div>
 <div class="card scroll"><table class="q"><thead><tr><th><input type="checkbox" id="all" aria-label="Select all" checked></th><th>ওষুধ</th><th>সাপ্লায়ার</th><th>স্টক</th><th>ন্যূনতম</th><th>বিক্রি/দিন</th><th>কত দিন চলবে</th><th>অর্ডার</th><th>শেষ দাম</th><th>খরচ</th></tr></thead><tbody id="tb"></tbody></table></div>
 <div class="row noprint"><button class="btn" id="po">📄 সাপ্লায়ার অনুযায়ী অর্ডার তৈরি</button><button class="btn2" id="csv">⬇ CSV (নির্বাচিত)</button><button class="btn2" id="pr">🖨 Print</button></div>
 <div id="pos"></div>
</div>
<p class="row noprint"><a class="btn2" href="dashboard.html">Dashboard</a><a class="btn2" href="purchases.html">Purchases</a><a class="btn2" href="suppliers.html">Suppliers</a></p>
</main>
<script src="assets/js/reorder-v58.js"></script><script src="assets/js/reorder-v74.js"></script>
</body></html>
