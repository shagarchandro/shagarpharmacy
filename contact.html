<!doctype html>
<html lang="en"><head><script src="assets/js/server-sync.js"></script><script src="assets/js/theme-mode.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="2;url=shop.html#/contact"><meta name="referrer" content="no-referrer"><link rel="canonical" href="shop.html#/contact">
<title>MediCare – Opening contact page…</title>
<style>:root{--bg:#f1f8f6;--fg:#12263a;--card:#fff;--br:#cfe3dd;--pri:#0f766e;--mut:#5b6b7b}@media(prefers-color-scheme:dark){:root{--bg:#0e1716;--fg:#e6f1ee;--card:#15211f;--br:#294341;--pri:#2dd4bf;--mut:#9db7b2}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Bengali",sans-serif;padding:16px;box-sizing:border-box}
.c{max-width:420px;width:100%;background:var(--card);border:1px solid var(--br);border-radius:18px;padding:1.6rem;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.i{font-size:2.6rem}h1{font-size:1.3rem;margin:.4rem 0}p{color:var(--mut);margin:.3rem 0}.bar{height:5px;border-radius:5px;background:var(--br);overflow:hidden;margin:1rem 0}.bar i{display:block;height:100%;width:0;background:var(--pri);animation:g 1.6s ease-out forwards}@keyframes g{to{width:100%}}
a.b{display:inline-block;margin-top:.4rem;background:var(--pri);color:#fff;text-decoration:none;border-radius:10px;padding:.55rem 1.1rem}@media(prefers-color-scheme:dark){a.b{color:#06201c}}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}</style><script src="assets/js/dialogs.js"></script></head>
<body><main class="c" role="status"><div class="i" aria-hidden="true">☎️</div><h1 id="t">Opening contact page…</h1><p id="s">যোগাযোগ পেজ খোলা হচ্ছে</p><div class="bar"><i></i></div>
<a class="b" id="go" href="shop.html#/contact">Continue →</a><p><small><a href="shop.html" style="color:inherit">← Back to shop</a></small></p>
<noscript><p>JavaScript is off — please use the button above.</p></noscript></main>
<script>
(function(){var t='contact',L=function(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
var s=(L('mc_db',{}).settings)||{};if(s.phone)document.getElementById('s').textContent='Call us: '+s.phone+(s.hours?' · '+s.hours:'');
var go=document.getElementById('go');go.href='shop.html#/'+t;document.querySelector('meta[http-equiv=refresh]').remove();
setTimeout(function(){location.replace('shop.html#/'+t)},1200);})();
</script></body></html>
