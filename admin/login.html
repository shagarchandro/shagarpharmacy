<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="no-referrer"><script src="../assets/js/theme.js"></script><script src="../assets/js/responsive.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b7a6b">
<title>MediCare Operations Panel – Login</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<style id="mcLoginX">body.loginpage{background-size:200% 200%;animation:mcbg 14s ease infinite}@keyframes mcbg{50%{background-position:100% 50%}}.logincard{border-radius:22px;animation:mcin .6s ease both}@keyframes mcin{from{opacity:0;transform:translateY(20px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head>
<body class="loginpage">
<main class="logincard">
  <h1>✚ MediCare Operations Panel</h1>
  <p class="muted">Owner · Pharmacist · Cashier · Inventory Manager · Delivery Staff</p>
  <div id="notice" class="alert" role="status" hidden></div>
  <form id="f" autocomplete="off">
    <fieldset class="users" aria-label="User"><legend>User / ইউজার</legend><div id="ul"></div></fieldset>
    <label><span id="cl">Demo code / ডেমো কোড</span>
      <span class="pwrow"><input id="c" type="password" autocomplete="off" required placeholder="" inputmode="text"><button type="button" id="eye" class="btn2" aria-label="Show / hide">👁</button></span>
    </label>
    <small class="muted" id="ch"></small>
    <p id="lock" class="lockmsg" role="alert" hidden></p>
    <button class="btn" id="go">Log in / লগ ইন</button>
  </form>
  <div class="access" id="acc"></div>
  <p class="muted small" id="last"></p>
  <p class="row center"><a class="btn2" href="../shop.html">🛒 Customer shop</a><a class="btn2" href="../login.html">🧑‍⚕️ Management dashboard</a><a class="btn2" href="../LOGIN-GUIDE.html">📖 Guide</a><a class="btn2" href="../index.html">🏠 Home</a></p>
</main>
<style>
.users{border:0;padding:0;margin:0 0 .6rem}.users legend{font-weight:600;margin-bottom:.3rem}#ul{display:grid;gap:.4rem}
.uc{display:flex;gap:.6rem;align-items:center;border:2px solid var(--br,#cfe3dd);border-radius:12px;padding:.5rem .7rem;cursor:pointer;background:var(--card,#fff);transition:.15s}
.uc:hover{transform:translateY(-1px)}.uc.on{border-color:var(--pri,#0b7a6b);box-shadow:0 0 0 3px rgba(11,122,107,.18)}.uc input{accent-color:var(--pri,#0b7a6b)}
.uc b{display:block}.uc small{color:#6b7a8a}.uc .pin{margin-left:auto;font-size:.75rem;border:1px solid currentColor;border-radius:999px;padding:0 .45rem;opacity:.8}
.pwrow{display:flex;gap:.4rem}.pwrow input{flex:1}.lockmsg{background:#fff4e5;color:#8a4b00;border-radius:8px;padding:.5rem .7rem;margin:.5rem 0}
#notice{background:#e8f3ff;color:#0b3b66;border-radius:8px;padding:.5rem .7rem;margin:.5rem 0}#notice.warn{background:#fff4e5;color:#8a4b00}
@media(prefers-color-scheme:dark){.uc{background:#14201e;border-color:#294341}.uc small{color:#9db7b2}.lockmsg,#notice.warn{background:#3a2a10;color:#ffd9a0}#notice{background:#12304a;color:#cfe6ff}}
</style>
<script src="../assets/js/core.js"></script><script src="../assets/js/pw.js"></script>
<script src="../assets/js/ops-login.js"></script>
</body>
</html>
